name: Entry files only

# pull_request_target runs this file as it is on main, so a pull request can't edit the check it has to pass.
on: pull_request_target

permissions:
  pull-requests: read

jobs:
  guard:
    name: Entry files only
    # A maintainer's own branch in this repository may change anything; a skipped job counts as passed.
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # This job must never check out or run anything from the pull request: it runs with this repository's
      # token. It only asks GitHub which files the pull request changes.
      - name: Refuse anything but entry files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Each name comes back as a JSON string, so a name with a line break in it stays one quoted line. The pattern
          # is the plugin-id rule check.yml uses, with the quotes.
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | (.filename, (.previous_filename // empty)) | @json')
          [ -n "$files" ] || { echo "::error::The changed files couldn't be listed."; exit 1; }
          # GitHub lists at most 3000 files of a pull request, so a long list is refused rather than trusted.
          if [ "$(printf '%s\n' "$files" | wc -l)" -gt 20 ] ||
             printf '%s\n' "$files" | LC_ALL=C grep -qvxE '"plugins/[a-z0-9]+(-[a-z0-9]+)*(\.[a-z0-9]+(-[a-z0-9]+)*)+\.json"'; then
            echo "::error::This pull request changes something other than an entry in plugins/. Its other check results mean nothing."
            exit 1
          fi
